services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - db
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tuPassword}
      POSTGRES_DB: cenitstoryteller
    volumes:
      - cenitstoryteller-data:/var/lib/postgresql/data   # contenido privado, fuera del repo

volumes:
  cenitstoryteller-data:
